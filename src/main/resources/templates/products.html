<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Products</title>
</head>
<body>
<a href="/home">← Home</a>
<h1>Products (Price ASC)</h1>

<div>
    <label>Filter by categoryId: <input id="categoryId" type="number" /></label>
    <button onclick="loadProductsByCategory()">Load by Category</button>
    <button onclick="loadAllProducts()">Load All (price asc)</button>
</div>

<div id="product-list"></div>

<hr/>
<h2>Create product</h2>
<div>
    <input id="p_title" placeholder="title"/>
    <input id="p_quantity" type="number" placeholder="quantity"/>
    <input id="p_price" type="number" step="0.01" placeholder="price"/>
    <input id="p_userId" type="number" placeholder="userId"/>
    <input id="p_desc" placeholder="description"/>
    <button onclick="createProduct()">Create</button>
</div>

<script>
    async function postGraphQL(query, variables = {}) {
        const resp = await fetch('/graphql', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables })
        });
        return resp.json();
    }

    async function loadAllProducts() {
        const query = `
        query {
          allProductsSortedByPriceAsc {
            id title price description user { id fullname }
          }
        }`;
        const res = await postGraphQL(query);
        const products = res.data.allProductsSortedByPriceAsc || [];
        renderProducts(products);
    }

    async function loadProductsByCategory() {
        const catId = document.getElementById('categoryId').value;
        if (!catId) { alert('Nhập categoryId'); return; }
        const query = `query($catId: ID!) {
        productsByCategory(categoryId: $catId) {
          id title price description user { id fullname }
        }
      }`;
        const res = await postGraphQL(query, { catId: parseInt(catId) });
        const products = res.data.productsByCategory || [];
        renderProducts(products);
    }

    function renderProducts(products) {
        const cont = document.getElementById('product-list');
        if (!products.length) { cont.innerHTML = '<p>No products</p>'; return; }
        cont.innerHTML = products.map(p => `
        <div style="border: 1px solid #ddd; padding: 8px; margin:6px;">
          <b>${p.title}</b> — $${p.price}<br/>
          <small>${p.description || ''}</small><br/>
          <small>By user: ${p.user ? p.user.fullname : 'N/A'}</small>
        </div>
      `).join('');
    }

    async function createProduct() {
        const title = document.getElementById('p_title').value;
        const quantity = parseInt(document.getElementById('p_quantity').value);
        const price = parseFloat(document.getElementById('p_price').value);
        const userId = parseInt(document.getElementById('p_userId').value);
        const description = document.getElementById('p_desc').value;

        const mutation = `
        mutation($input: ProductInput!) {
          createProduct(input: $input) {
            id title price
          }
        }
      `;
        const variables = { input: { title, quantity, description, price, userId } };
        const res = await postGraphQL(mutation, variables);
        if (res.errors) { alert(JSON.stringify(res.errors)); return; }
        alert('Created: ' + JSON.stringify(res.data.createProduct));
        loadAllProducts();
    }

    // load default
    window.onload = loadAllProducts;
</script>
</body>
</html>
