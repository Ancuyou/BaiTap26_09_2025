<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"/><title>Users</title></head>
<body>
<a href="/home">← Home</a>
<h1>Users</h1>
<div>
    <input id="u_fullname" placeholder="fullname" />
    <input id="u_email" placeholder="email" />
    <input id="u_password" placeholder="password" />
    <input id="u_phone" placeholder="phone" />
    <button onclick="createUser()">Create</button>
</div>
<div id="user-list"></div>

<script>
    async function postGraphQL(query, variables={}) {
        const resp = await fetch('/graphql', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({query, variables})});
        return resp.json();
    }

    async function loadUsers(){
        const q = `query { users { id fullname email phone } }`;
        const r = await postGraphQL(q);
        const data = r.data.users || [];
        document.getElementById('user-list').innerHTML = data.map(u => `<div>${u.id} - ${u.fullname} (${u.email})</div>`).join('');
    }

    async function createUser(){
        const input = {
            fullname: document.getElementById('u_fullname').value,
            email: document.getElementById('u_email').value,
            password: document.getElementById('u_password').value,
            phone: document.getElementById('u_phone').value
        };
        const m = `mutation($input: UserInput!){ createUser(input:$input) { id fullname } }`;
        const r = await postGraphQL(m, { input });
        if (r.errors) { alert(JSON.stringify(r.errors)); return; }
        loadUsers();
    }

    window.onload = loadUsers;
</script>
</body>
</html>
