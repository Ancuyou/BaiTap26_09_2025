<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Category Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="container py-4">
<h2 class="mb-4">Category Management</h2>
<a href="/" class="btn btn-secondary mb-3">Back to Users</a>

<!-- Form Create/Update Category -->
<div class="mb-4">
  <form id="categoryForm">
    <input type="hidden" id="categoryId">
    <div class="mb-2">
      <input type="text" id="name" class="form-control" placeholder="Category Name" required>
    </div>
    <div class="mb-2">
      <input type="text" id="images" class="form-control" placeholder="Image URL">
    </div>
    <button class="btn btn-primary">Save</button>
  </form>
</div>

<table class="table table-bordered">
  <thead>
  <tr>
    <th>ID</th><th>Name</th><th>Image</th><th>Action</th>
  </tr>
  </thead>
  <tbody id="categoryTable"></tbody>
</table>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  const GRAPHQL_URL = '/graphql';
  const userId = new URLSearchParams(window.location.search).get('userId');

  function loadCategories() {
    $.ajax({
      url: GRAPHQL_URL,
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify({ query: '{ categories { id name images } }' }),
      success: function (data) {
        console.log("GraphQL response:", data);
        const categories = data.data.categories;
        let rows = '';
        categories.forEach(c => {
          rows += `<tr>
                        <td>${c.id}</td>
                        <td>${c.name}</td>
                        <td><img src="${c.images || '#'}" style="width:50px;height:50px"></td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editCategory(${c.id}, '${c.name}', '${c.images || ''}')">Edit</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${c.id})">Delete</button>
                            <a href="/products?categoryId=${c.id}" class="btn btn-sm btn-info">Products</a>
                        </td>
                    </tr>`;
        });
        $('#categoryTable').html(rows);
      },
      error: function (xhr) {
        console.error("GraphQL loadCategories error:", xhr.responseText);
        alert("Error loading categories: " + xhr.responseText);
      }
    });
  }

  $('#categoryForm').submit(function (e) {
    e.preventDefault();
    const id = $('#categoryId').val();
    const mutation = id ? `
            mutation {
              updateCategory(id: ${id}, input: {
                name: "${$('#name').val()}",
                images: "${$('#images').val()}",
                userIds: [${userId}]
              }) { id }
            }
        ` : `
            mutation {
              createCategory(input: {
                name: "${$('#name').val()}",
                images: "${$('#images').val()}",
                userIds: [${userId}]
              }) { id }
            }
        `;

    $.ajax({
      url: GRAPHQL_URL,
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify({ query: mutation }),
      success: function () {
        loadCategories();
        $('#categoryForm')[0].reset();
      },
      error: function (xhr) {
        console.error("GraphQL saveCategory error:", xhr.responseText);
        alert("Error saving category: " + xhr.responseText);
      }
    });
  });

  function editCategory(id, name, images) {
    $('#categoryId').val(id);
    $('#name').val(name);
    $('#images').val(images);
  }

  function deleteCategory(id) {
    $.ajax({
      url: GRAPHQL_URL,
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify({ query: `mutation { deleteCategory(id: ${id}) }` }),
      success: function () {
        loadCategories();
      },
      error: function (xhr) {
        console.error("GraphQL deleteCategory error:", xhr.responseText);
        alert("Error deleting category: " + xhr.responseText);
      }
    });
  }

  $(document).ready(loadCategories);
</script>
</body>
</html>
