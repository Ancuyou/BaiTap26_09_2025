<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Categories</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    .card { border: 1px solid #ddd; padding: 10px; margin: 8px 0; border-radius: 6px; }
    .form-row { margin-bottom: 8px; }
  </style>
</head>
<body>
<a href="/home">← Home</a>
<h1>Categories</h1>

<section>
  <h3>Create Category</h3>
  <div class="form-row">
    <label>Name: <input id="c_name" type="text" /></label>
  </div>
  <div class="form-row">
    <label>Images (URL): <input id="c_images" type="text" /></label>
  </div>
  <button id="btnCreate">Create</button>
  <div id="createResult"></div>
</section>

<hr/>

<section>
  <h3>List of Categories</h3>
  <div id="category-list">Loading...</div>
</section>

<script>
  async function postGraphQL(query, variables = {}) {
    const resp = await fetch('/graphql', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, variables })
    });
    return resp.json();
  }

  async function loadCategories() {
    const query = `
        query {
          categories {
            id
            name
            images
            users { id fullname email }
          }
        }
      `;
    const res = await postGraphQL(query);
    if (res.errors) {
      document.getElementById('category-list').innerText = 'Error: ' + JSON.stringify(res.errors);
      return;
    }
    const cats = res.data.categories || [];
    const html = cats.length ? cats.map(c => `
         <div class="card">
           <strong>${c.name}</strong> (id: ${c.id})<br/>
           <div>Images: ${c.images ? `<a href="${c.images}" target="_blank">link</a>` : '—'}</div>
           <div>Managers: ${c.users && c.users.length ? c.users.map(u => u.fullname + ' ('+u.email+')').join(', ') : 'None'}</div>
         </div>
      `).join('') : '<p>No categories</p>';
    document.getElementById('category-list').innerHTML = html;
  }

  async function createCategory() {
    const name = document.getElementById('c_name').value.trim();
    const images = document.getElementById('c_images').value.trim();
    if (!name) { alert('Nhập tên category'); return; }

    const mutation = `
        mutation($input: CategoryInput!) {
          createCategory(input: $input) {
            id name images
          }
        }
      `;
    const variables = { input: { name, images } };
    const res = await postGraphQL(mutation, variables);
    if (res.errors) {
      document.getElementById('createResult').innerText = 'Error: ' + JSON.stringify(res.errors);
      return;
    }
    const created = res.data.createCategory;
    document.getElementById('createResult').innerText = 'Created: ' + created.name + ' (id: ' + created.id + ')';
    // clear form
    document.getElementById('c_name').value = '';
    document.getElementById('c_images').value = '';
    // reload list
    loadCategories();
  }

  document.getElementById('btnCreate').addEventListener('click', createCategory);
  window.onload = loadCategories;
</script>
</body>
</html>
